<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swiss Army Blockchain Desktop</title>
    <script>
      // Inline polyfill to ensure Buffer is available before any other scripts
      if (typeof globalThis === 'undefined') {
        var globalThis = global || self || window || {};
      }
      
      // Define global if it doesn't exist
      if (typeof global === 'undefined') {
        globalThis.global = globalThis;
      }
      
      // This will be replaced by the actual Buffer polyfill when the module loads
      globalThis.Buffer = globalThis.Buffer || function() {
        throw new Error('Buffer not loaded yet');
      };
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
